# Builds a signed Android APK and the Windows installer for every version tag
# (v1.2.3) and attaches them to a GitHub Release. Steps and secrets: docs/RELEASING.md
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    # Some tests use Windows paths.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag must match pubspec.yaml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')"
          if [ "$tag" != "$pub" ]; then
            echo "::error::Tag $tag does not match pubspec.yaml version $pub"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags "audio,network"

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key from the secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # An unsigned or debug-signed APK could not update friends' installs:
          # stop instead of publishing one.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing, see docs/RELEASING.md"
            exit 1
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/key.properties"
          echo "PRISM_KEY_PROPERTIES=$dir/key.properties" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Universal APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Per-CPU APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - name: Name the files
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/Prism-$v.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/Prism-$v-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/Prism-$v-armeabi-v7a.apk"
          rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: libmpv and ffmpeg.exe (too big for git)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tool/fetch_windows_deps.ps1
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Installer
        shell: pwsh
        env:
          PRISM_VERSION: ${{ needs.check.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\prism.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Prism-Setup-*.exe

  release:
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: files/**/*

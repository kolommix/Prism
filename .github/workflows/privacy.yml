# Fails on every push and pull request if Prism asks for a location permission,
# any permission not listed in docs/PRIVACY.md, or adds a banned package.
name: Privacy

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Accept Android licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: No banned packages
        run: dart run tool/privacy_check.dart --lock pubspec.lock
      - name: Build the merged manifest
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:processReleaseMainManifest
      - name: No location or unlisted permission in the merged manifest
        run: dart run tool/privacy_check.dart --manifest build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
